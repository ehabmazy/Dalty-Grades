<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض الدرجات — Dalty Grades</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e; --bg2: #0f1e35; --bg3: #0a1628;
    --border: #1e3a5f; --blue: #1d4ed8; --blue-light: #3b82f6;
    --text: #e2e8f0; --text2: #94a3b8;
    --green: #10b981; --yellow: #f59e0b; --red: #ef4444;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; direction: rtl; }

  .header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; position: sticky; top: 0; z-index: 100; }
  .header-title { font-size: 16px; font-weight: 900; color: #60a5fa; }
  .header-sub { font-size: 11px; color: var(--text2); }
  .sync-badge { font-size: 10px; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); }
  .sync-badge.ok { border-color: var(--green); color: #6ee7b7; background: #0a2a1a; }
  .sync-badge.err { border-color: var(--red); color: #fca5a5; background: #2a0a0a; }

  .controls { padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--bg3); border-bottom: 1px solid var(--border); }
  .search-box { flex: 1; min-width: 200px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 14px; color: var(--text); font-family: 'Cairo', sans-serif; font-size: 13px; outline: none; }
  .search-box:focus { border-color: var(--blue-light); }

  /* زر نسخ رابط الطالب */
  .link-btn { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text2); font-size: 11px; padding: 2px 7px; cursor: pointer; font-family: 'Cairo', sans-serif; white-space: nowrap; transition: all .2s; }
  .link-btn:hover { border-color: var(--blue-light); color: var(--blue-light); }
  .link-btn.copied { border-color: var(--green); color: #6ee7b7; }

  /* بطاقة الطالب الفردية */
  .student-card { max-width: 700px; margin: 30px auto; background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .student-card-header { background: linear-gradient(135deg,#0f2a50,#1d4ed8); padding: 24px 28px; }
  .student-card-name { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 4px; }
  .student-card-meta { font-size: 12px; color: #93c5fd; }
  .student-card-body { padding: 20px 28px; }
  .scard-stat { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  .scard-stat-item { text-align: center; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 12px 20px; flex: 1; min-width: 100px; }
  .scard-stat-val { font-size: 22px; font-weight: 900; }
  .scard-stat-lbl { font-size: 11px; color: var(--text2); margin-top: 3px; }
  .scard-weeks { width: 100%; border-collapse: collapse; font-size: 13px; }
  .scard-weeks th { background: var(--bg3); border: 1px solid var(--border); padding: 8px 10px; color: var(--text2); font-weight: 600; text-align: center; }
  .scard-weeks td { border: 1px solid var(--border); padding: 8px 10px; text-align: center; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--bg2); border: 1px solid var(--border); color: var(--text2); border-radius: var(--radius); padding: 8px 16px; font-family: 'Cairo', sans-serif; font-size: 13px; cursor: pointer; margin: 16px 20px; text-decoration: none; }
  .back-btn:hover { border-color: var(--blue-light); color: var(--blue-light); }
  .search-box::placeholder { color: var(--text2); }
  select.cls-sel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 14px; color: var(--text); font-family: 'Cairo', sans-serif; font-size: 13px; outline: none; cursor: pointer; min-width: 130px; }

  .info-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 20px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .info-chip { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 3px 12px; font-size: 11px; color: var(--text2); }
  .info-chip span { color: #60a5fa; font-weight: 700; }

  .stats-row { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 20px; }
  .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 18px; text-align: center; min-width: 90px; }
  .stat-val { font-size: 20px; font-weight: 900; color: #60a5fa; }
  .stat-lbl { font-size: 10px; color: var(--text2); margin-top: 2px; }

  .table-wrap { overflow-x: auto; padding: 0 20px 20px; }

  table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 700px; }

  /* رأس المجموعات */
  thead tr.group-row th {
    background: #0a1e45;
    border: 1px solid var(--border);
    padding: 6px 4px;
    text-align: center;
    color: #93c5fd;
    font-weight: 700;
    font-size: 11px;
  }
  thead tr.group-row th.week-head { background: #0f2a5e; }
  thead tr.group-row th.avg-head  { background: #0a2a1a; color: #6ee7b7; }
  thead tr.group-row th.sum-head  { background: #1a1a0a; color: #fcd34d; }

  /* رأس الأعمدة */
  thead tr.col-row th {
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 6px 4px;
    text-align: center;
    color: #60a5fa;
    font-weight: 700;
    font-size: 10px;
    white-space: nowrap;
  }
  thead tr.col-row th:first-child { text-align: right; }

  tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
  tbody tr:hover { background: var(--bg2); }
  tbody td { padding: 6px 6px; border: 1px solid #0f2540; text-align: center; color: var(--text); font-size: 11px; }
  tbody td:first-child { text-align: right; font-weight: 600; min-width: 160px; padding-right: 10px; }

  .grade-high { color: #6ee7b7; font-weight: 700; }
  .grade-mid  { color: #fcd34d; font-weight: 700; }
  .grade-low  { color: #fca5a5; font-weight: 700; }
  .grade-abs  { color: #475569; font-size: 10px; }
  .grade-total { font-size: 13px; font-weight: 900; }

  .rank-badge { display: inline-block; width: 20px; height: 20px; border-radius: 50%; font-size: 9px; font-weight: 900; line-height: 20px; text-align: center; margin-left: 4px; }
  .rank-1 { background: #fcd34d; color: #000; }
  .rank-2 { background: #94a3b8; color: #000; }
  .rank-3 { background: #c47c1d; color: #fff; }

  .search-found { background: #0a2a4a !important; border-right: 3px solid var(--blue-light) !important; }

  .center-msg { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 14px; }
  .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--blue-light); border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer { text-align: center; padding: 20px; font-size: 11px; color: var(--text2); border-top: 1px solid var(--border); margin-top: 10px; }

  @media (max-width: 600px) {
    .header, .controls, .info-bar, .stats-row { padding: 10px 12px; }
    .table-wrap { padding: 0 10px 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title" id="schoolTitle">📊 Dalty Grades</div>
    <div class="header-sub" id="schoolSub">جاري التحميل...</div>
  </div>
  <div id="syncBadge" class="sync-badge">⏳ جاري الاتصال...</div>
</div>

<div class="controls">
  <select class="cls-sel" id="clsSel" onchange="onClassChange()">
    <option value="">— اختر الفصل —</option>
  </select>
  <input class="search-box" id="searchBox" type="text" placeholder="🔍 ابحث باسم الطالب..." oninput="onSearch()" />
  <button onclick="clearSearch()" style="background:var(--bg2);border:1px solid var(--border);color:var(--text2);border-radius:var(--radius);padding:8px 14px;font-family:Cairo,sans-serif;font-size:12px;cursor:pointer;">✕ مسح</button>
</div>

<div class="info-bar" id="infoBar" style="display:none;">
  <div class="info-chip">المادة: <span id="infoSubject">—</span></div>
  <div class="info-chip">الصف: <span id="infoGrade">—</span></div>
  <div class="info-chip">العام: <span id="infoYear">—</span></div>
  <div class="info-chip">المدرس: <span id="infoTeacher">—</span></div>
  <div class="info-chip">الأسابيع المعروضة: <span id="infoWeeks">—</span></div>
</div>

<div class="stats-row" id="statsRow" style="display:none;">
  <div class="stat-card"><div class="stat-val" id="statTotal">—</div><div class="stat-lbl">عدد الطلاب</div></div>
  <div class="stat-card"><div class="stat-val grade-high" id="statHigh">—</div><div class="stat-lbl">أعلى مجموع</div></div>
  <div class="stat-card"><div class="stat-val grade-mid" id="statAvg">—</div><div class="stat-lbl">المتوسط</div></div>
  <div class="stat-card"><div class="stat-val grade-low" id="statLow">—</div><div class="stat-lbl">أدنى مجموع</div></div>
</div>

<div class="table-wrap" id="tableWrap">
  <div class="center-msg"><div class="spinner"></div><div>جاري تحميل البيانات...</div></div>
</div>

<div class="footer" id="footerTxt">Dalty Grades — عرض الدرجات</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
var FIREBASE_CONFIG = {
  apiKey:            "AIzaSyBS9rW0XqtFCrX0wjrn9NinsxaRLE4EFxE",
  authDomain:        "dalty-grades.firebaseapp.com",
  databaseURL:       "https://dalty-grades-default-rtdb.firebaseio.com",
  projectId:         "dalty-grades",
  storageBucket:     "dalty-grades.firebasestorage.app",
  messagingSenderId: "927174576910",
  appId:             "1:927174576910:web:70ca8e14568bb194bc655f"
};
var _urlParams = new URLSearchParams(location.search);
var _uidParam  = _urlParams.get('uid');
var FB_PATH = _uidParam
  ? "dalty_grades/users/" + _uidParam + "/data"
  : "dalty_grades/main"; /* fallback للروابط القديمة */
var DB = null, currentClass = "", searchTerm = "";

function restoreKeys(obj) {
  if (typeof obj !== "object" || obj === null) return obj;
  if (Array.isArray(obj)) return obj.map(restoreKeys);
  var out = {};
  Object.keys(obj).forEach(function(k) {
    var o = k.replace(/__DOT__/g,".").replace(/__HASH__/g,"#").replace(/__DOLLAR__/g,"$").replace(/__SLASH__/g,"/").replace(/__LB__/g,"[").replace(/__RB__/g,"]");
    out[o] = restoreKeys(obj[k]);
  });
  return out;
}

firebase.initializeApp(FIREBASE_CONFIG);
var ref = firebase.database().ref(FB_PATH);

var _firstLoad = true;

ref.on("value", function(snap) {
  var raw = snap.val();
  if (!raw) { setSyncBadge("err","❌ لا توجد بيانات"); showMsg("لا توجد بيانات بعد."); return; }

  var incoming = restoreKeys(raw);
  delete incoming._ts; delete incoming._device;

  if (_firstLoad) {
    /* أول تحميل — ابنِ الواجهة كاملاً */
    _firstLoad = false;
    DB = incoming;
    setSyncBadge("ok","✅ متزامن");
    buildUI();
    if (STUDENT_MODE) renderStudentCard(STUDENT_MODE);
  } else {
    /* تحديث لاحق — حدّث البيانات فقط وأعِد رسم الجدول بدون إعادة بناء كل شيء */
    DB = incoming;
    setSyncBadge("ok", "🔄 تم التحديث");
    setTimeout(function() { setSyncBadge("ok","✅ متزامن"); }, 2000);

    if (STUDENT_MODE) {
      /* وضع طالب واحد — حدّث بطاقته */
      renderStudentCard(STUDENT_MODE);
    } else {
      /* وضع الجدول الكامل — حدّث الجدول مع الحفاظ على الفصل المختار */
      renderTable();
    }
  }
}, function(e) {
  setSyncBadge("err","❌ " + e.message);
  showMsg("فشل الاتصال: " + e.message);
});

function buildUI() {
  if (!DB) return;
  var m = DB.meta || {};
  document.getElementById("schoolTitle").textContent = "📊 " + (m.schoolName || "Dalty Grades");
  document.getElementById("schoolSub").textContent = (m.subject||"") + " | " + (m.grade||"") + " | " + (m.year||"");
  document.getElementById("infoSubject").textContent = m.subject  || "—";
  document.getElementById("infoGrade").textContent   = m.grade    || "—";
  document.getElementById("infoYear").textContent    = m.year     || "—";
  document.getElementById("infoTeacher").textContent = m.teacherName || "—";
  document.getElementById("infoWeeks").textContent   = (m.activeWeeks || "—") + " أسبوع";
  document.getElementById("infoBar").style.display   = "flex";
  document.getElementById("footerTxt").textContent   = (m.schoolName||"Dalty Grades") + " — " + (m.teacherName||"") + " | " + (m.year||"");

  var sel = document.getElementById("clsSel");
  sel.innerHTML = '<option value="">— اختر الفصل —</option>';
  var classes = DB.classes || Object.keys(DB.data || {});
  classes.forEach(function(c) {
    var o = document.createElement("option");
    o.value = c; o.textContent = "فصل " + c;
    sel.appendChild(o);
  });
  if (classes.length === 1) { sel.value = classes[0]; currentClass = classes[0]; }
  renderTable();
}

function getActiveWeeks() {
  return parseInt((DB.meta && DB.meta.activeWeeks) || 14);
}

function gradeColor(v, max) {
  if (v === null || v === undefined || v === "" || v === "غ" || v === "ع") return "grade-abs";
  var n = Number(v); if (isNaN(n)) return "grade-abs";
  var pct = max ? (n / max * 100) : n;
  if (pct >= 75) return "grade-high";
  if (pct >= 50) return "grade-mid";
  return "grade-low";
}

function safeNum(v) {
  if (v === undefined || v === null || v === "" || v === "غ" || v === "ع") return null;
  var n = Number(v); return isNaN(n) ? null : n;
}

function avg(arr) {
  var vals = arr.filter(function(x){ return x !== null; });
  if (!vals.length) return null;
  return Math.round((vals.reduce(function(a,b){return a+b;},0) / vals.length) * 10) / 10;
}

function renderTable() {
  var wrap = document.getElementById("tableWrap");
  if (!DB) { showMsg("جاري التحميل..."); return; }
  if (!currentClass) {
    wrap.innerHTML = '<div class="center-msg">👆 اختر الفصل من القائمة أعلاه</div>';
    document.getElementById("statsRow").style.display = "none";
    return;
  }

  var students = (DB.data && DB.data[currentClass]) ? DB.data[currentClass] : [];
  if (!Array.isArray(students)) students = Object.values(students);
  if (!students.length) {
    wrap.innerHTML = '<div class="center-msg">لا توجد بيانات لهذا الفصل.</div>';
    document.getElementById("statsRow").style.display = "none";
    return;
  }

  var W = getActiveWeeks();

  /* حساب بيانات كل طالب */
  var rows = students.map(function(st) {
    var weeks = [];
    for (var w = 1; w <= W; w++) {
      weeks.push({
        a:  safeNum(st["a"  + w]),
        h:  safeNum(st["h"  + w]),
        bw: safeNum(st["bw" + w])
      });
    }
    var allA  = weeks.map(function(x){return x.a;});
    var allH  = weeks.map(function(x){return x.h;});
    var allBW = weeks.map(function(x){return x.bw;});
    var ex1 = safeNum(st.ex1), ex2 = safeNum(st.ex2);
    var avgA  = avg(allA);
    var avgH  = avg(allH);
    var avgBW = avg(allBW);
    var avgEx = avg([ex1, ex2]);
    var total = null;
    if (!st._totalAbsent) {
      var parts = [avgA, avgH, avgBW, avgEx].filter(function(x){return x!==null;});
      if (parts.length) total = Math.round(parts.reduce(function(a,b){return a+b;},0));
    }
    return { st: st, weeks: weeks, avgA: avgA, avgH: avgH, avgBW: avgBW, ex1: ex1, ex2: ex2, avgEx: avgEx, total: total };
  });

  /* ترتيب */
  var ranked = rows.slice().sort(function(a,b){ return (b.total||0)-(a.total||0); });
  var rankMap = {};
  ranked.forEach(function(r,i){ if(r.total!==null) rankMap[r.st.id||r.st.name] = i+1; });

  /* إحصاءات */
  var totals = rows.filter(function(r){return r.total!==null;}).map(function(r){return r.total;});
  document.getElementById("statTotal").textContent = students.length;
  document.getElementById("statHigh").textContent  = totals.length ? Math.max.apply(null,totals) : "—";
  document.getElementById("statAvg").textContent   = totals.length ? Math.round(totals.reduce(function(a,b){return a+b;},0)/totals.length) : "—";
  document.getElementById("statLow").textContent   = totals.length ? Math.min.apply(null,totals) : "—";
  document.getElementById("statsRow").style.display = "flex";

  /* تصفية البحث */
  var filtered = rows;
  if (searchTerm) {
    var q = searchTerm.toLowerCase();
    filtered = rows.filter(function(r){ return r.st.name && r.st.name.toLowerCase().indexOf(q) !== -1; });
  }
  if (!filtered.length) { wrap.innerHTML = '<div class="center-msg">🔍 لم يُعثر على طالب.</div>'; return; }

  /* رسم الجدول */
  var h = '<table><thead>';

  /* صف المجموعات */
  h += '<tr class="group-row">';
  h += '<th rowspan="2" style="min-width:160px;text-align:right;">اسم الطالب</th>';
  h += '<th rowspan="2" style="min-width:80px;text-align:center;">رابط</th>';
  for (var w = 1; w <= W; w++) {
    h += '<th colspan="3" class="week-head">أسبوع ' + w + '</th>';
  }
  h += '<th colspan="3" class="avg-head">المتوسطات</th>';
  h += '<th colspan="2" class="avg-head">الاختبارات</th>';
  h += '<th rowspan="2" class="sum-head">المجموع</th>';
  h += '</tr>';

  /* صف الأعمدة */
  h += '<tr class="col-row">';
  for (var w = 1; w <= W; w++) {
    h += '<th>تقييم</th><th>واجب</th><th>سلوك</th>';
  }
  h += '<th>تقييم</th><th>واجب</th><th>سلوك</th>';
  h += '<th>اختبار 1</th><th>اختبار 2</th>';
  h += '</tr></thead><tbody>';

  filtered.forEach(function(row) {
    var st    = row.st;
    var rank  = rankMap[st.id || st.name];
    var isFound = searchTerm && st.name && st.name.toLowerCase().indexOf(searchTerm.toLowerCase()) !== -1;
    var rCls  = isFound ? ' class="search-found"' : '';

    h += '<tr' + rCls + '>';

    /* اسم الطالب + ترتيب */
    var badge = '';
    if (rank === 1) badge = '<span class="rank-badge rank-1">1</span>';
    else if (rank === 2) badge = '<span class="rank-badge rank-2">2</span>';
    else if (rank === 3) badge = '<span class="rank-badge rank-3">3</span>';
    h += '<td>' + badge + (st.name||'—') + '</td>';
    var studentUrl = location.href.split('?')[0] + '?student=' + encodeURIComponent(st.name||'');
    h += '<td style="text-align:center;"><button class="link-btn" onclick="copyStudentLink(this,\'' + (st.name||'').replace(/'/g,"\\'") + '\')" title="نسخ رابط الطالب">🔗 نسخ</button></td>';

    /* أعمدة كل أسبوع */
    for (var w = 0; w < W; w++) {
      var wk = row.weeks[w];
      h += cellVal(wk.a,  20);
      h += cellVal(wk.h,  10);
      h += cellVal(wk.bw, 10);
    }

    /* متوسطات */
    h += cellVal(row.avgA,  20);
    h += cellVal(row.avgH,  10);
    h += cellVal(row.avgBW, 10);

    /* اختبارات */
    h += cellVal(row.ex1, 15);
    h += cellVal(row.ex2, 15);

    /* مجموع */
    if (st._totalAbsent) {
      h += '<td><span class="grade-abs">غائب</span></td>';
    } else {
      var tc = gradeColor(row.total, Math.max.apply(null, totals.concat([1])));
      h += '<td class="grade-total ' + tc + '">' + (row.total !== null ? row.total : '—') + '</td>';
    }

    h += '</tr>';
  });

  h += '</tbody></table>';
  if (searchTerm && filtered.length) {
    h += '<div style="padding:8px 4px;font-size:11px;color:var(--text2);">نتائج البحث: ' + filtered.length + ' طالب</div>';
  }
  wrap.innerHTML = h;

  if (searchTerm) {
    var found = wrap.querySelector(".search-found");
    if (found) found.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}

function cellVal(v, max) {
  if (v === null || v === undefined) return '<td><span class="grade-abs">—</span></td>';
  var cls = gradeColor(v, max);
  return '<td class="' + cls + '">' + v + '</td>';
}

function onClassChange() { currentClass = document.getElementById("clsSel").value; searchTerm = ""; document.getElementById("searchBox").value = ""; renderTable(); }
function onSearch() { searchTerm = document.getElementById("searchBox").value.trim(); renderTable(); }
function clearSearch() { searchTerm = ""; document.getElementById("searchBox").value = ""; renderTable(); }
function showMsg(msg) { document.getElementById("tableWrap").innerHTML = '<div class="center-msg">' + msg + '</div>'; }
function setSyncBadge(type, msg) {
  var el = document.getElementById("syncBadge");
  el.textContent = msg;
  el.className = "sync-badge " + (type==="ok"?"ok":type==="err"?"err":"");
}

/* ═══════════════════════════════════
   نسخ رابط الطالب
   ═══════════════════════════════════ */
function copyStudentLink(btn, name) {
  var base = location.href.split('?')[0];
  var uid  = _uidParam || '';
  var url  = base + '?uid=' + encodeURIComponent(uid) + '&student=' + encodeURIComponent(name);
  navigator.clipboard.writeText(url).then(function() {
    btn.textContent = '✅ تم النسخ';
    btn.classList.add('copied');
    setTimeout(function() { btn.textContent = '🔗 نسخ'; btn.classList.remove('copied'); }, 2000);
  }).catch(function() {
    prompt('انسخ الرابط:', url);
  });
}

/* ═══════════════════════════════════
   وضع عرض طالب واحد عبر URL
   ═══════════════════════════════════ */
var STUDENT_MODE = (function() {
  var p = new URLSearchParams(location.search);
  return p.get('student') || null;
})();

function renderStudentCard(name) {
  /* ابحث عن الطالب في كل الفصول */
  var found = null, foundClass = null;
  var allClasses = DB.classes || Object.keys(DB.data || {});
  allClasses.forEach(function(cls) {
    var students = (DB.data && DB.data[cls]) ? DB.data[cls] : [];
    if (!Array.isArray(students)) students = Object.values(students);
    students.forEach(function(st) {
      if (st.name && st.name === name) { found = st; foundClass = cls; }
    });
  });

  if (!found) {
    document.getElementById("tableWrap").innerHTML = '<div class="center-msg">❌ لم يُعثر على الطالب: ' + name + '</div>';
    return;
  }

  /* إخفاء عناصر الجدول */
  document.getElementById("controls") && (document.getElementById("controls").style.display = "none");
  var ctrl = document.querySelector(".controls");
  if (ctrl) ctrl.style.display = "none";

  var m = DB.meta || {};
  var W = parseInt(m.activeWeeks) || 0;
  var weeks = [];
  for (var w = 1; w <= W; w++) {
    weeks.push({ w: w, a: safeNum(found["a"+w]), h: safeNum(found["h"+w]), bw: safeNum(found["bw"+w]) });
  }
  var ex1 = safeNum(found.ex1), ex2 = safeNum(found.ex2);
  var avgA  = avg(weeks.map(function(x){return x.a;}));
  var avgH  = avg(weeks.map(function(x){return x.h;}));
  var avgBW = avg(weeks.map(function(x){return x.bw;}));
  var avgEx = avg([ex1, ex2]);
  var parts = [avgA, avgH, avgBW, avgEx].filter(function(x){return x!==null;});
  var total = parts.length ? Math.round(parts.reduce(function(a,b){return a+b;},0)) : null;

  var totalColor = total === null ? '' : total >= 80 ? 'grade-high' : total >= 60 ? 'grade-mid' : 'grade-low';

  var h = '<a class="back-btn" href="' + location.href.split('?')[0] + '">← عودة للجدول الكامل</a>';
  h += '<div class="student-card">';
  h += '<div class="student-card-header">';
  h += '<div class="student-card-name">👤 ' + (found.name||'—') + '</div>';
  h += '<div class="student-card-meta">' + (m.subject||'') + ' | فصل ' + foundClass + ' | ' + (m.year||'') + ' | ' + (m.teacherName||'') + '</div>';
  h += '</div>';
  h += '<div class="student-card-body">';

  /* إحصاءات سريعة */
  h += '<div class="scard-stat">';
  h += '<div class="scard-stat-item"><div class="scard-stat-val ' + totalColor + '">' + (found._totalAbsent ? '<span class="grade-abs">غائب</span>' : (total !== null ? total : '—')) + '</div><div class="scard-stat-lbl">المجموع الكلي</div></div>';
  h += '<div class="scard-stat-item"><div class="scard-stat-val">' + (avgA !== null ? avgA.toFixed(1) : '—') + '</div><div class="scard-stat-lbl">متوسط التقييم</div></div>';
  h += '<div class="scard-stat-item"><div class="scard-stat-val">' + (avgH !== null ? avgH.toFixed(1) : '—') + '</div><div class="scard-stat-lbl">متوسط الواجب</div></div>';
  h += '<div class="scard-stat-item"><div class="scard-stat-val">' + (avgEx !== null ? avgEx.toFixed(1) : '—') + '</div><div class="scard-stat-lbl">متوسط الاختبارات</div></div>';
  h += '</div>';

  /* جدول الأسابيع */
  if (W > 0) {
    h += '<table class="scard-weeks"><thead><tr>';
    h += '<th>الأسبوع</th><th>تقييم</th><th>واجب</th><th>سلوك</th>';
    h += '</tr></thead><tbody>';
    weeks.forEach(function(wk) {
      h += '<tr><td>أسبوع ' + wk.w + '</td>';
      h += '<td>' + (wk.a !== null ? wk.a : '—') + '</td>';
      h += '<td>' + (wk.h !== null ? wk.h : '—') + '</td>';
      h += '<td>' + (wk.bw !== null ? wk.bw : '—') + '</td>';
      h += '</tr>';
    });
    /* الاختبارات */
    h += '<tr style="background:var(--bg3);font-weight:700;"><td>اختبار 1</td><td colspan="3">' + (ex1 !== null ? ex1 : '—') + '</td></tr>';
    h += '<tr style="background:var(--bg3);font-weight:700;"><td>اختبار 2</td><td colspan="3">' + (ex2 !== null ? ex2 : '—') + '</td></tr>';
    h += '</tbody></table>';
  }

  h += '</div></div>';
  document.getElementById("tableWrap").innerHTML = h;
  document.getElementById("statsRow").style.display = "none";
  document.getElementById("infoBar").style.display = "none";
  document.title = "درجات " + (found.name||'') + " — Dalty Grades";
}

</script>
