<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>الصفحة غير موجودة — Dalty Grades</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#0a0f1e;
    color:#e2e8f0;
    font-family:'Segoe UI',Tahoma,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .container{max-width:360px;}
  .logo{
    width:90px;height:90px;
    border-radius:50%;
    border:2.5px solid #c9a227;
    box-shadow:0 0 24px rgba(201,162,39,.35);
    margin:0 auto 24px;
    display:block;
    object-fit:contain;
    background:#000;
  }
  .code{
    font-size:72px;
    font-weight:900;
    color:#2563eb;
    line-height:1;
    margin-bottom:12px;
    text-shadow:0 0 30px rgba(37,99,235,.4);
  }
  h1{font-size:20px;margin-bottom:10px;color:#f1f5f9;}
  p{font-size:14px;color:#94a3b8;line-height:1.7;margin-bottom:28px;}
  a{
    display:inline-block;
    padding:12px 32px;
    background:linear-gradient(135deg,#1d4ed8,#2563eb);
    color:#fff;
    border-radius:12px;
    text-decoration:none;
    font-size:15px;
    font-weight:700;
    box-shadow:0 4px 14px rgba(37,99,235,.35);
    transition:transform .2s,box-shadow .2s;
  }
  a:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(37,99,235,.5);}
</style>
</head>
<body>
<div class="container">
  <img src="images/logo.jpg" class="logo" alt="Dalty Grades"/>
  <div class="code">404</div>
  <h1>الصفحة غير موجودة</h1>
  <p>الرابط الذي أدخلته غير صحيح أو تم نقل الصفحة.<br/>اضغط الزر أدناه للعودة للتطبيق.</p>
  <a href="./">🏠 العودة للتطبيق</a>
</div>
</body>
</html>
