<!DOCTYPE html>
<!--
  admin-subscriptions.html
  لوحة أدمن لتفعيل/تجديد اشتراك أي معلم بعد استلام تحويل إنستاباي
  افتحها انت بس (صاحب المشروع) — متشاركهاش مع المعلمين

  نظام الفصول الدراسية:
  - يونيو/يوليو/أغسطس: فترة مجانية (لا داعي للتفعيل)
  - الفصل الأول: سبتمبر -> يناير
  - الفصل الثاني: فبراير -> مايو
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>لوحة تفعيل الاشتراكات — Dalty Grades</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background:#0a0f1e; color:#fff; padding:24px; max-width:480px; margin:auto; }
  h1 { font-size:20px; margin-bottom:6px; }
  .sub { font-size:12px; color:#64748b; margin-bottom:20px; }
  label { display:block; margin-top:14px; font-size:14px; color:#aab; }
  input, select { width:100%; padding:10px; margin-top:6px; border-radius:8px; border:1px solid #334; background:#141a2e; color:#fff; box-sizing:border-box; font-size:14px; }
  button { margin-top:20px; width:100%; padding:12px; background:#2563eb; border:none; border-radius:8px; color:#fff; font-size:15px; cursor:pointer; }
  button:hover { background:#1d4ed8; }
  #status { margin-top:16px; padding:10px; border-radius:8px; font-size:14px; display:none; }
  .ok { background:#14532d; }
  .err { background:#7f1d1d; }
  .preview { margin-top:14px; background:#0a1628; border:1px dashed #334; border-radius:8px; padding:10px 12px; font-size:13px; color:#93c5fd; display:none; }
</style>
</head>
<body>

<h1>🔑 تفعيل / تجديد اشتراك معلم</h1>
<div class="sub">20 جنيه لكل فصل دراسي — يونيو/يوليو/أغسطس مجاني تلقائيًا</div>

<label>UID الخاص بالمعلم (من Firebase Auth)</label>
<input id="teacherUid" placeholder="مثال: a1B2c3D4..." />

<label>اسم المعلم (للتوثيق فقط)</label>
<input id="teacherName" placeholder="مثال: أحمد محمد" />

<label>الفصل الدراسي</label>
<select id="term" onchange="updatePreview()">
  <option value="term1">الفصل الأول (سبتمبر - يناير)</option>
  <option value="term2">الفصل الثاني (فبراير - مايو)</option>
</select>

<div class="preview" id="preview"></div>

<button id="activateBtn">✅ تفعيل الاشتراك</button>
<div id="status"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBS9rW0XqtFCrX0wjrn9NinsxaRLE4EFxE",
    authDomain: "dalty-grades.firebaseapp.com",
    projectId: "dalty-grades",
    storageBucket: "dalty-grades.firebasestorage.app",
    messagingSenderId: "927174576910",
    appId: "1:927174576910:web:70ca8e14568bb194bc655f",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  /* ⚠️ لازم تكون مسجل دخول بحساب الأدمن بتاعك (نفس الـ UID اللي في firestore.rules)
     قبل ما تستخدم الصفحة دي، وإلا هياخد خطأ permission-denied */

  const statusEl = document.getElementById("status");
  const previewEl = document.getElementById("preview");

  // نفس منطق حساب تاريخ الانتهاء الموجود في auth.js
  function computeTermEndDate(term) {
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth() + 1; // 1-12

    if (term === "term1") {
      // الفصل الأول: سبتمبر - يناير
      if (m === 1) {
        return new Date(y, 0, 31, 23, 59, 59); // ينتهي يناير من نفس السنة
      }
      return new Date(y + 1, 0, 31, 23, 59, 59); // ينتهي يناير السنة الجاية
    } else {
      // الفصل الثاني: فبراير - مايو
      if (m >= 2 && m <= 5 || m === 1) {
        return new Date(y, 4, 31, 23, 59, 59); // ينتهي مايو من نفس السنة
      }
      return new Date(y + 1, 4, 31, 23, 59, 59); // ينتهي مايو السنة الجاية
    }
  }

  window.updatePreview = function() {
    const term = document.getElementById("term").value;
    const end = computeTermEndDate(term);
    previewEl.style.display = "block";
    previewEl.textContent = "📅 سينتهي الاشتراك تلقائيًا بتاريخ: " + end.toLocaleDateString("ar-EG");
  };
  updatePreview();

  document.getElementById("activateBtn").addEventListener("click", async () => {
    const uid = document.getElementById("teacherUid").value.trim();
    const name = document.getElementById("teacherName").value.trim();
    const term = document.getElementById("term").value;

    if (!uid) {
      showStatus("من فضلك أدخل UID المعلم", false);
      return;
    }

    const now = new Date();
    const endDate = computeTermEndDate(term);

    try {
      await setDoc(doc(db, "subscriptions", uid), {
        teacherName: name || "غير محدد",
        active: true,
        term: term,
        startDate: Timestamp.fromDate(now),
        endDate: Timestamp.fromDate(endDate),
        amountPaid: 20,
        paymentMethod: "InstaPay",
        updatedAt: Timestamp.fromDate(now),
      });

      showStatus(`تم تفعيل ${term === "term1" ? "الفصل الأول" : "الفصل الثاني"} حتى ${endDate.toLocaleDateString("ar-EG")}`, true);
    } catch (err) {
      showStatus("خطأ: " + err.message, false);
    }
  });

  function showStatus(msg, ok) {
    statusEl.textContent = msg;
    statusEl.style.display = "block";
    statusEl.className = ok ? "ok" : "err";
  }
</script>

</body>
</html>
